[package]
name = "loshido"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1
codegen-units = 8

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1

[features]
otel = [
	"dep:opentelemetry", "dep:opentelemetry-otlp",
	"dep:tracing-opentelemetry", "dep:tracing-subscriber"
]
default = ["otel"]

[dependencies]
axum = "0.8.8"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }

opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing = "0.1.44"
