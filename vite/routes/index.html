<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livio Ardoin</title>
    <link rel="stylesheet" href="../src/style.css">
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml.">
    <meta property="og:title" content="Livio Ardoin" />
    <meta property="og:url" content="https://loshido.me/" />
    <meta property="og:image" content="https://loshido.me/ogp-banner.webp" />
</head> 
<body class="w-screen h-full p-6 md:px-32 lg:px-64 md:py-8 lg:py-16 stripes flex flex-col gap-8 md:gap-16">
    <header>
        <h1 class="text-2xl font-bold">
            Livio Ardoin <span class="text-xs text-black/5">Loshido</span>
        </h1>
        <p>
            Second year of engineering prep at <a href="https://isen-mediterranee.fr" target="_blank" class="anim">ISEN Méditerannée</a><br/>
            on a university exchange in South Korea this spring at <a href="https://hanyang.ac.kr" target="_blank" class="anim">Hanyang University</a>.
        </p>
    </header>

    <section class="group">
        <h2 class="text-xl font-semibold h-fit mb-2 flex flex-row items-center gap-1">
            Projects
            <label class="hidden sm:block w-5 h-5 p-0.5 hover:rotate-45 transition-all hover:bg-accent hover:*:stroke-white bg-transparent
                rounded-full cursor-pointer has-checked:rotate-90 ">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" 
                    stroke-width="2" fill="none" stroke="currentColor"
                    class="h-4 w-4 transition-colors" >
                    <path d="m9 18 6-6-6-6"/>
                </svg>
                <input type="checkbox" class="hidden">
            </label>
        </h2>

        <div id="projects" class="flex flex-row flex-wrap gap-2 group-has-checked:flex-col 
            *:backdrop-blur-sm group-has-checked:*:w-full">
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
            <div class="rounded w-full sm:w-60 h-24 bg-black/10 animate-pulse transition-colors"></div>
        </div>
        <script type="module" src="../src/home/projects/mod.ts"></script>
    </section>
    <section>
        <h2 class="text-xl font-semibold mb-2">Contact</h2>

        <div class="flex flex-row flex-wrap gap-2">
            <a class="rounded w-60 text-lg h-16 bg-black/5 hover:bg-black/10 transition-colors
                flex flex-row gap-2 items-center justify-center cursor-pointer select-none"
                href="mailto:loshido@pm.me" target="_blank">
                <img src="/assets/email.svg" alt="Email" width="24" height="24" draggable="false">
                <code class="font-satoshi font-medium text-black">loshido@pm.me</code>
            </a>
            <a class="rounded w-16 p-1 h-16 bg-black/5 hover:bg-black/10 transition-colors
                flex items-center justify-center cursor-pointer select-none"
                href="https://github.com/Loshido" target="_blank">
                <img src="/assets/github.svg" alt="Github" width="24" height="24" draggable="false">
            </a>
            <a class="rounded w-16 p-1 h-16 bg-black/5 hover:bg-black/10 transition-colors
                flex items-center justify-center cursor-pointer select-none"
                href="https://linkedin.com/in/livio-ardoin/" target="_blank">
                <img src="/assets/in.svg" alt="LinkedIn" width="24" height="24" draggable="false">
            </a>
        </div>
    </section>
    <section>
        <h2 class="text-xl font-semibold mb-2">Skills & Interests</h2>

        <div id="skills" class="w-full h-80 relative border border-black/5 rounded">
            <script src="../src/home/skills/mod.ts" type="module" defer></script>
        </div>
    </section>
</body>
</html>
